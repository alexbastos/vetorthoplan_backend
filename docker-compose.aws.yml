services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VETORTHOPLAN_POSTGRES_DB:?Configure VETORTHOPLAN_POSTGRES_DB}
      POSTGRES_USER: ${VETORTHOPLAN_POSTGRES_USER:?Configure VETORTHOPLAN_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VETORTHOPLAN_POSTGRES_PASSWORD:?Configure VETORTHOPLAN_POSTGRES_PASSWORD}
    volumes:
      - vetorthoplan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [vetorthoplan]

  migrate:
    image: vetorthoplan-backend:current
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [vetorthoplan]

  api:
    image: vetorthoplan-backend:current
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["uvicorn", "vetorthoplan.bootstrap:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [vetorthoplan]

  worker:
    image: vetorthoplan-backend:current
    env_file: .env
    command: ["python", "-m", "vetorthoplan.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [vetorthoplan]

networks:
  vetorthoplan:

volumes:
  vetorthoplan_postgres_data:
