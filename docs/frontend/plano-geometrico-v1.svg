  <text x="1497" y="564" text-anchor="end" font-size="12" fill="#698094">ANGLE</text>
  <rect x="1150" y="596" width="370" height="57" rx="9" fill="#fff" stroke="#e5ebf0"/>
  <circle cx="1175" cy="624" r="7" fill="#ed7890"/>
  <text x="1193" y="629" font-size="14" fill="#334a60">Círculo 01</text>
  <text x="1497" y="629" text-anchor="end" font-size="12" fill="#698094">CIRCLE</text>
  <rect x="1150" y="661" width="370" height="57" rx="9" fill="#fff" stroke="#e5ebf0"/>
  <circle cx="1175" cy="689" r="7" fill="#9884e3"/>
  <text x="1193" y="694" font-size="14" fill="#334a60">Parâmetros TPLO</text>
  <text x="1497" y="694" text-anchor="end" font-size="12" fill="#698094">TPLO</text>

