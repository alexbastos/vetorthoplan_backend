<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Referência de interface para plano geométrico VetOrthoPlan</title>
  <desc id="desc">Wireframe de editor de radiografia com calibração, objetos geométricos, revisão versionada e aviso de conflito. Referência conceitual para os endpoints GET e PUT de plano.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24384a"/>
      <stop offset="1" stop-color="#101c29"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa" stop-opacity=".86"/>
      <stop offset="1" stop-color="#bac8d4" stop-opacity=".54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#20354a" flood-opacity=".10"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 14px; fill: #617286; }
      .label { font-size: 16px; fill: #33465a; }
      .muted { fill: #718196; }
      .tool { font-size: 14px; fill: #42566d; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#eef2f6"/>
  <rect x="24" y="22" width="1552" height="956" rx="20" fill="#fff" filter="url(#shadow)"/>

