services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vetorthoplan
      POSTGRES_PASSWORD: vetorthoplan
      POSTGRES_USER: vetorthoplan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetorthoplan -d vetorthoplan"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vetorthoplan_postgres_data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-test}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - vetorthoplan_rustfs_data:/data
    restart: unless-stopped

volumes:
  vetorthoplan_postgres_data:
  vetorthoplan_rustfs_data:
