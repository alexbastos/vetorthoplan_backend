  <circle cx="498" cy="319" r="6" fill="#fff" stroke="#13b7b0" stroke-width="3"/>
  <circle cx="714" cy="790" r="6" fill="#fff" stroke="#13b7b0" stroke-width="3"/>
  <rect x="420" y="535" width="128" height="34" rx="8" fill="#063b42"/>
