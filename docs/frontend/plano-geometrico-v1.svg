  <text x="1430" y="64" font-size="14" fill="#52667a">Revisão 3</text>
  <circle cx="1528" cy="60" r="19" fill="#eaf0f5"/>
  <text x="1528" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#52667a">CP</text>

