  <line x1="514" y1="647" x2="765" y2="605" stroke="#ffcb61" stroke-width="3"/>
  <circle cx="514" cy="647" r="5" fill="#fff" stroke="#f1ad32" stroke-width="3"/>
  <circle cx="765" cy="605" r="5" fill="#fff" stroke="#f1ad32" stroke-width="3"/>
  <path d="M636 627 A61 61 0 0 1 690 579" fill="none" stroke="#ffcb61" stroke-width="3"/>
