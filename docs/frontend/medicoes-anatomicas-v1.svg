<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Referência visual: medições anatômicas em radiografia</title>
  <desc id="desc">Wireframe conceitual com radiografia sintética, ferramentas de linha, círculo e ângulo, calibração manual validada e valores de medida.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="bone" x2="0" y2="1"><stop stop-color="#e5e7eb"/><stop offset=".48" stop-color="#aeb8c8"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#334155" stroke-width="1" opacity=".2"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="76" fill="#172033"/>
  <text x="34" y="32" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">VETORTHOPLAN</text>
  <text x="34" y="56" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Planejamento pré-operatório TPLO · Referência visual conceitual</text>
  <text x="465" y="45" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="16">Paciente sintético 01</text>
  <rect x="1347" y="23" width="219" height="32" rx="16" fill="#143b34" stroke="#2dd4a0"/>
  <circle cx="1368" cy="39" r="5" fill="#2dd4a0"/><text x="1382" y="44" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="13">Calibração validada</text>

  <rect x="20" y="94" width="100" height="875" rx="12" fill="#172033" stroke="#334155"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="32" y="112" width="76" height="62" rx="9" fill="#1e293b"/><text x="70" y="139" fill="#94a3b8" font-size="22">⌖</text><text x="70" y="161" fill="#cbd5e1" font-size="11">Navegar</text>
    <rect x="32" y="184" width="76" height="62" rx="9" fill="#064e3b" stroke="#34d399"/><text x="70" y="211" fill="#6ee7b7" font-size="22">↔</text><text x="70" y="233" fill="#d1fae5" font-size="11">Linha</text>
    <rect x="32" y="256" width="76" height="62" rx="9" fill="#1e293b"/><circle cx="70" cy="281" r="11" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="307" fill="#cbd5e1" font-size="11">Círculo</text>
    <rect x="32" y="328" width="76" height="62" rx="9" fill="#1e293b"/><path d="M54 361h30m-30 0 20-18m-20 18 18 17" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="379" fill="#cbd5e1" font-size="11">Ângulo</text>
    <rect x="32" y="400" width="76" height="62" rx="9" fill="#1e293b"/><text x="70" y="427" fill="#cbd5e1" font-size="22">T</text><text x="70" y="449" fill="#cbd5e1" font-size="11">Anotação</text>
    <path d="M34 481h72" stroke="#334155"/><text x="70" y="512" fill="#64748b" font-size="10">CAMADAS</text>
    <text x="70" y="544" fill="#34d399" font-size="17">●</text><text x="70" y="564" fill="#94a3b8" font-size="10">Medidas</text>
    <text x="70" y="600" fill="#64748b" font-size="17">○</text><text x="70" y="620" fill="#94a3b8" font-size="10">Referências</text>
    <text x="70" y="932" fill="#64748b" font-size="18">↶</text><text x="70" y="952" fill="#94a3b8" font-size="10">Desfazer</text>
  </g>

  <rect x="134" y="94" width="1000" height="875" rx="12" fill="#090e18" stroke="#334155"/>
  <rect x="146" y="106" width="976" height="851" rx="8" fill="#101827"/>
  <rect x="146" y="106" width="976" height="851" rx="8" fill="url(#grid)"/>
