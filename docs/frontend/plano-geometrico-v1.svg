  <rect x="666" y="627" width="65" height="31" rx="7" fill="#654318"/>
  <text x="698" y="648" text-anchor="middle" font-size="13" font-weight="700" fill="#ffebbd">Ângulo</text>
  <circle cx="690" cy="682" r="77" fill="none" stroke="#fb7f98" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="690" cy="682" r="5" fill="#fff" stroke="#f56784" stroke-width="3"/>
  <path d="M672 744 A95 95 0 0 0 780 672" fill="none" stroke="#a995ff" stroke-width="4" stroke-dasharray="7 5"/>
  <rect x="784" y="697" width="71" height="31" rx="7" fill="#433866"/>
