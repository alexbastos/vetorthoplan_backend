services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vetorthoplan
      POSTGRES_PASSWORD: vetorthoplan
      POSTGRES_USER: vetorthoplan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetorthoplan -d vetorthoplan"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vetorthoplan_postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
      DATA_DIR: /var/lib/localstack/data
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - vetorthoplan_localstack_data:/var/lib/localstack
    restart: unless-stopped

volumes:
  vetorthoplan_postgres_data:
  vetorthoplan_localstack_data:
