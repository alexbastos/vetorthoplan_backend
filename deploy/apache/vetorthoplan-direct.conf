# Include this file inside the existing HTTPS VirtualHost for cecia.ufsj.edu.br.
# The site's DocumentRoot and /wiki Alias remain untouched.
ProxyPreserveHost On
ProxyTimeout 600
RequestHeader set X-Forwarded-Proto "https"

ProxyPass        /api/                         http://127.0.0.1:8000/api/ retry=0 timeout=60
ProxyPassReverse /api/                         http://127.0.0.1:8000/api/
ProxyPass        /docs                         http://127.0.0.1:8000/docs retry=0 timeout=60
ProxyPassReverse /docs                         http://127.0.0.1:8000/docs
ProxyPass        /openapi.json                 http://127.0.0.1:8000/openapi.json retry=0 timeout=60
ProxyPassReverse /openapi.json                 http://127.0.0.1:8000/openapi.json
ProxyPass        /health/live                  http://127.0.0.1:8000/health/live retry=0 timeout=10
ProxyPassReverse /health/live                  http://127.0.0.1:8000/health/live
ProxyPass        /health/ready                 http://127.0.0.1:8000/health/ready retry=0 timeout=10
ProxyPassReverse /health/ready                 http://127.0.0.1:8000/health/ready

# Preserve the Host and path used to sign S3 POST/GET URLs.
ProxyPass        /vetorthoplan-uploads-local   http://127.0.0.1:9000/vetorthoplan-uploads-local nocanon retry=0 timeout=600
ProxyPassReverse /vetorthoplan-uploads-local   http://127.0.0.1:9000/vetorthoplan-uploads-local
<Location "/vetorthoplan-uploads-local">
    LimitRequestBody 115343360
</Location>
