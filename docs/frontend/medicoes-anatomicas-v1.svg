  <!-- Calibration reference retained in the reference layer. -->
  <line x1="806" y1="262" x2="906" y2="262" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 5"/>
  <circle cx="806" cy="262" r="5" fill="#38bdf8"/><circle cx="906" cy="262" r="5" fill="#38bdf8"/>
  <rect x="817" y="232" width="143" height="24" rx="6" fill="#082f49" opacity=".96"/><text x="829" y="249" fill="#bae6fd" font-family="Arial,sans-serif" font-size="12">Referência · 25 mm</text>
  <!-- Linear anatomical measurement -->
  <line x1="538" y1="411" x2="636" y2="411" stroke="#34d399" stroke-width="3"/>
  <circle cx="538" cy="411" r="5" fill="#34d399"/><circle cx="636" cy="411" r="5" fill="#34d399"/>
