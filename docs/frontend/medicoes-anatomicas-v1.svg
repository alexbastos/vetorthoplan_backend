  <circle cx="572" cy="641" r="30" fill="#10b981" fill-opacity=".1" stroke="#34d399" stroke-width="3"/>
  <line x1="572" y1="641" x2="602" y2="641" stroke="#a7f3d0" stroke-width="2"/><circle cx="572" cy="641" r="4" fill="#a7f3d0"/><circle cx="602" cy="641" r="4" fill="#a7f3d0"/>
  <rect x="612" y="620" width="98" height="24" rx="6" fill="#064e3b"/><text x="623" y="637" fill="#d1fae5" font-family="Arial,sans-serif" font-size="12">Ø 11,2 mm</text>
  <!-- Angle measurement -->
  <path d="M540 791 L611 758 L659 812" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M572 776 A44 44 0 0 1 641 791" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="611" cy="758" r="4" fill="#fbbf24"/>
  <rect x="661" y="772" width="79" height="24" rx="6" fill="#713f12"/><text x="672" y="789" fill="#fef3c7" font-family="Arial,sans-serif" font-size="12">42,6°</text>
  <rect x="168" y="899" width="421" height="36" rx="8" fill="#111c2c" stroke="#334155"/>
  <text x="184" y="922" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Zoom 125%</text><text x="286" y="922" fill="#475569" font-family="Arial,sans-serif" font-size="13">|</text><text x="306" y="922" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Pan ativo ao segurar espaço</text>

  <rect x="1150" y="94" width="430" height="875" rx="12" fill="#172033" stroke="#334155"/>
  <text x="1178" y="133" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">Medições</text>
  <text x="1178" y="158" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">3 marcações · coordenadas na imagem original</text>
  <rect x="1174" y="179" width="382" height="76" rx="10" fill="#102a26" stroke="#16805f"/>
  <circle cx="1196" cy="202" r="5" fill="#34d399"/><text x="1211" y="207" fill="#d1fae5" font-family="Arial,sans-serif" font-size="13" font-weight="700">Calibração manual ativa</text>
  <text x="1191" y="233" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="12">0,250 mm/px</text><text x="1300" y="233" fill="#6b8b83" font-family="Arial,sans-serif" font-size="11">· linha de referência · 25,0 mm</text>
  <text x="1178" y="291" fill="#64748b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">OBJETOS</text>
  <rect x="1174" y="307" width="382" height="104" rx="10" fill="#1e293b" stroke="#34d399"/>
  <rect x="1174" y="307" width="4" height="104" rx="2" fill="#34d399"/><text x="1192" y="333" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="14" font-weight="700">Linha · comprimento</text><text x="1192" y="357" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Pontos anatômicos selecionados</text><text x="1192" y="390" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="20" font-weight="700">18,4 mm</text><text x="1487" y="390" fill="#64748b" font-family="Arial,sans-serif" font-size="11">Editar</text>
  <rect x="1174" y="423" width="382" height="104" rx="10" fill="#1e293b" stroke="#34d399"/>
  <rect x="1174" y="423" width="4" height="104" rx="2" fill="#34d399"/><text x="1192" y="449" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="14" font-weight="700">Círculo · diâmetro</text><text x="1192" y="473" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Centro e borda definidos</text><text x="1192" y="506" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="20" font-weight="700">11,2 mm</text><text x="1487" y="506" fill="#64748b" font-family="Arial,sans-serif" font-size="11">Editar</text>
  <rect x="1174" y="539" width="382" height="104" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <rect x="1174" y="539" width="4" height="104" rx="2" fill="#fbbf24"/><text x="1192" y="565" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="14" font-weight="700">Ângulo</text><text x="1192" y="589" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Vértice entre os dois lados</text><text x="1192" y="622" fill="#fde68a" font-family="Arial,sans-serif" font-size="20" font-weight="700">42,6°</text><text x="1487" y="622" fill="#64748b" font-family="Arial,sans-serif" font-size="11">Editar</text>
  <text x="1178" y="683" fill="#64748b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">DETALHES DA SELEÇÃO</text>
  <text x="1180" y="714" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Nome</text><rect x="1260" y="695" width="294" height="34" rx="6" fill="#0f172a" stroke="#334155"/><text x="1272" y="717" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12">Comprimento tibial</text>
  <text x="1180" y="761" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">Visibilidade</text><rect x="1260" y="742" width="16" height="16" rx="3" fill="#10b981"/><path d="m1264 750 3 3 6-7" fill="none" stroke="#fff" stroke-width="1.5"/><text x="1285" y="755" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="12">Exibir na imagem</text>
  <line x1="1178" y1="787" x2="1552" y2="787" stroke="#334155"/>
  <text x="1178" y="820" fill="#64748b" font-family="Arial,sans-serif" font-size="11">A escala vem da calibração manual validada.</text>
  <text x="1178" y="840" fill="#64748b" font-family="Arial,sans-serif" font-size="11">PixelSpacing DICOM é apenas informativo.</text>
