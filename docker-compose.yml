services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vetorthoplan
      POSTGRES_PASSWORD: vetorthoplan
      POSTGRES_USER: vetorthoplan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetorthoplan -d vetorthoplan"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vetorthoplan_postgres_data:/var/lib/postgresql/data

volumes:
  vetorthoplan_postgres_data:

