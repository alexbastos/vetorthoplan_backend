  <g opacity=".9" filter="url(#glow)">
    <path d="M565 218 C532 254 537 314 550 364 C565 421 581 458 568 492 C555 526 520 547 514 586 C507 630 529 666 564 672 C598 677 628 651 626 613 C624 580 605 554 606 520 C608 478 628 438 640 388 C652 336 660 278 631 235 C615 210 587 202 565 218Z" fill="url(#bone)" stroke="#f8fafc" stroke-width="2" opacity=".8"/>
